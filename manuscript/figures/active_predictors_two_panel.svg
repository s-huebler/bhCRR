<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 940" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif">
<title>Subdistribution vs cause-specific selection geometry — two panel</title>
<desc>Top: Venn diagram of candidate predictors with red Z1, purple Z-shared, teal Z2 regions. Middle: subdistribution plane with three vertical bands (red, purple, teal) showing the union of three predictor groups; three colored vectors sum head-to-tail to the linear predictor eta. Bottom: cause-specific plane (red+purple bands only) with two in-plane vectors summing to eta1, and a teal Z2-beta-2 vector escaping straight up out of the plane to indicate it is outside the span.</desc>

<rect width="720" height="940" fill="white"/>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
</defs>

<!-- VENN -->
<g>
  <ellipse cx="360" cy="125" rx="300" ry="90" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="80" y="40" font-size="12" fill="#6B7280" font-style="italic">All candidate predictors</text>
  <circle cx="280" cy="125" r="85" fill="#FECACA" fill-opacity="0.6" stroke="#B91C1C" stroke-width="2"/>
  <circle cx="440" cy="125" r="85" fill="#A7F3D0" fill-opacity="0.6" stroke="#0F766E" stroke-width="2"/>
  <path d="M 360 96.28 A 85 85 0 0 1 360 153.72 A 85 85 0 0 1 360 96.28 Z" fill="#DDD6FE" fill-opacity="0.85" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="218" y="132" font-size="22" font-style="italic" fill="#B91C1C" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Z&#185;</text>
  <text x="360" y="132" font-size="22" font-style="italic" fill="#6D28D9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Z&#7506;</text>
  <text x="500" y="132" font-size="22" font-style="italic" fill="#0F766E" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">Z&#178;</text>
  <text x="218" y="158" font-size="11" fill="#B91C1C" text-anchor="middle">event 1 only</text>
  <text x="360" y="158" font-size="11" fill="#6D28D9" text-anchor="middle">shared</text>
  <text x="500" y="158" font-size="11" fill="#0F766E" text-anchor="middle">event 2 only</text>
  <text x="360" y="240" font-size="13" text-anchor="middle">
    <tspan font-weight="600">Active set</tspan> = Z&#185; &#8746; Z&#7506; &#8746; Z&#178;
    <tspan font-style="italic" fill="#6B7280">  (any predictor that touches either event)</tspan>
  </text>
</g>

<line x1="60" y1="265" x2="660" y2="265" stroke="#E5E7EB"/>

<!-- PANEL A: SUBDISTRIBUTION (tri-band fill = literal union) -->
<g>
  <text x="80" y="290" font-size="13" font-weight="600" fill="#111827">Subdistribution hazard h(t) &#8212; Fine&#8211;Gray spans the entire active set</text>
  <polygon points="160,310 330,310 260,510 90,510" fill="#FEE2E2" fill-opacity="0.55"/>
  <polygon points="330,310 500,310 430,510 260,510" fill="#EDE9FE" fill-opacity="0.7"/>
  <polygon points="500,310 670,310 600,510 430,510" fill="#CCFBF1" fill-opacity="0.55"/>
  <line x1="330" y1="310" x2="260" y2="510" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="500" y1="310" x2="430" y2="510" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
  <polygon points="160,310 670,310 600,510 90,510" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="245" y="328" font-size="10" fill="#B91C1C" text-anchor="middle" font-style="italic">Z&#185; region</text>
  <text x="415" y="328" font-size="10" fill="#6D28D9" text-anchor="middle" font-style="italic">Z&#7506; region</text>
  <text x="585" y="328" font-size="10" fill="#0F766E" text-anchor="middle" font-style="italic">Z&#178; region</text>

  <circle cx="160" cy="475" r="3" fill="#111827"/>
  <text x="146" y="492" font-size="11" font-style="italic" fill="#374151">O</text>
  <line x1="160" y1="475" x2="290" y2="460" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="208" y="453" font-size="13" fill="#B91C1C" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#185;&#946;&#8321;</text>
  <line x1="290" y1="460" x2="410" y2="445" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="333" y="438" font-size="13" fill="#6D28D9" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#7506;&#946;&#8347;</text>
  <line x1="410" y1="445" x2="555" y2="428" stroke="#0F766E" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="475" y="422" font-size="13" fill="#0F766E" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#178;&#946;&#8322;</text>
  <line x1="160" y1="475" x2="555" y2="428" stroke="#111827" stroke-width="3.5" marker-end="url(#ad)" stroke-linecap="round"/>
  <text x="565" y="430" font-size="13" font-weight="600" font-style="italic" fill="#111827">&#951; &#8594; log h(t)</text>
</g>

<line x1="60" y1="540" x2="660" y2="540" stroke="#E5E7EB"/>

<!-- PANEL B: CAUSE-SPECIFIC + Z2 ESCAPE -->
<g>
  <text x="80" y="565" font-size="13" font-weight="600" fill="#7F1D1D">Cause-specific hazard h&#8321;(t) &#8212; Cox; Z&#178; lies outside event 1's span</text>
  <polygon points="160,720 415,720 350,900 90,900" fill="#FEE2E2" fill-opacity="0.6"/>
  <polygon points="415,720 670,720 600,900 350,900" fill="#EDE9FE" fill-opacity="0.7"/>
  <line x1="415" y1="720" x2="350" y2="900" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
  <polygon points="160,720 670,720 600,900 90,900" fill="none" stroke="#B91C1C" stroke-width="2"/>
  <text x="287" y="738" font-size="10" fill="#B91C1C" text-anchor="middle" font-style="italic">Z&#185; region</text>
  <text x="500" y="738" font-size="10" fill="#6D28D9" text-anchor="middle" font-style="italic">Z&#7506; region</text>

  <circle cx="160" cy="860" r="3" fill="#111827"/>
  <text x="146" y="878" font-size="11" font-style="italic" fill="#374151">O</text>
  <line x1="160" y1="860" x2="295" y2="843" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="210" y="836" font-size="13" fill="#B91C1C" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#185;&#946;&#8321;</text>
  <line x1="295" y1="843" x2="425" y2="826" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="345" y="819" font-size="13" fill="#6D28D9" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#7506;&#946;&#8347;</text>
  <line x1="160" y1="860" x2="425" y2="826" stroke="#111827" stroke-width="3.5" marker-end="url(#ad)" stroke-linecap="round"/>
  <text x="438" y="827" font-size="13" font-weight="600" font-style="italic" fill="#111827">&#951;&#8321; &#8594; log h&#8321;(t)</text>

  <!-- Z2 escape: dashed in-plane trace + solid out-of-plane vector -->
  <line x1="160" y1="860" x2="160" y2="720" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="160" y1="720" x2="160" y2="615" stroke="#0F766E" stroke-width="2.5" marker-end="url(#at)"/>
  <text x="172" y="618" font-size="13" fill="#0F766E" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Z&#178;&#946;&#8322;</text>
  <text x="172" y="635" font-size="11" fill="#0F766E">outside event-1 span</text>
  <text x="172" y="650" font-size="11" fill="#0F766E">&#8594; contributes 0 to &#951;&#8321;</text>

  <!-- Right-angle indicator showing perpendicularity to plane -->
  <path d="M 160 730 L 170 730 L 170 720" fill="none" stroke="#374151" stroke-width="1"/>
</g>

</svg>
