<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 1240" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <title>Variable selection geometry in competing risks: subdistribution vs cause-specific hazards</title>
  <desc>A Venn diagram of all candidate predictors with three regions Z1 (event 1 only, red), Z-shared (purple), Z2 (event 2 only, teal), followed by three stacked panels illustrating how each hazard model decomposes the linear predictor into vector components.</desc>

  <defs>
    <marker id="ah-red"    viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker>
    <marker id="ah-teal"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="ah-dark"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  </defs>

  <!-- TITLE -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">
    Variable selection geometry: which predictors does each hazard model see?
  </text>

  <!-- TOP: VENN -->
  <g id="venn">
    <text x="60" y="80" font-size="13" font-weight="600" fill="#374151" letter-spacing="1.5">A.  CANDIDATE PREDICTOR SPACE</text>

    <ellipse cx="410" cy="220" rx="370" ry="135" fill="#FAFAFA" stroke="#374151" stroke-width="1.5"/>
    <text x="92" y="115" font-size="13" fill="#374151" font-style="italic">All candidate predictors</text>

    <circle cx="320" cy="225" r="105" fill="#FEE2E2" fill-opacity="0.7" stroke="#B91C1C" stroke-width="2"/>
    <circle cx="490" cy="225" r="105" fill="#CCFBF1" fill-opacity="0.7" stroke="#0F766E" stroke-width="2"/>

    <g font-family="'Iowan Old Style','Palatino', Georgia, serif">
      <text x="245" y="220" font-size="26" font-style="italic" fill="#B91C1C">Z</text>
      <text x="263" y="210" font-size="16" font-style="italic" fill="#B91C1C">1</text>

      <text x="402" y="220" font-size="26" font-style="italic" fill="#6D28D9">Z</text>
      <text x="420" y="210" font-size="16" font-style="italic" fill="#6D28D9">S</text>

      <text x="555" y="220" font-size="26" font-style="italic" fill="#0F766E">Z</text>
      <text x="573" y="210" font-size="16" font-style="italic" fill="#0F766E">2</text>
    </g>
    <text x="265" y="260" font-size="11" fill="#B91C1C" text-anchor="middle">event 1 only</text>
    <text x="411" y="260" font-size="11" fill="#6D28D9" text-anchor="middle">shared</text>
    <text x="563" y="260" font-size="11" fill="#0F766E" text-anchor="middle">event 2 only</text>

    <text x="410" y="335" font-size="13" fill="#111827" text-anchor="middle">
      <tspan font-weight="600">Active set</tspan>
      <tspan> = </tspan>
      <tspan fill="#B91C1C" font-style="italic">Z</tspan><tspan fill="#B91C1C" font-size="9" dy="-4">1</tspan>
      <tspan dy="4"> &#8746; </tspan>
      <tspan fill="#6D28D9" font-style="italic">Z</tspan><tspan fill="#6D28D9" font-size="9" dy="-4">S</tspan>
      <tspan dy="4"> &#8746; </tspan>
      <tspan fill="#0F766E" font-style="italic">Z</tspan><tspan fill="#0F766E" font-size="9" dy="-4">2</tspan>
      <tspan dy="4">  &#8212;  any predictor that affects either event, directly or indirectly</tspan>
    </text>
  </g>

  <line x1="60" y1="370" x2="760" y2="370" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="395" font-size="13" font-weight="600" fill="#374151" letter-spacing="1.5">B.  WHAT EACH MODEL SELECTS</text>

  <!-- PLANE A: SUBDISTRIBUTION -->
  <g id="planeA">
    <polygon points="150,420 760,420 700,580 90,580" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>

    <text x="170" y="450" font-size="14" font-weight="600" fill="#4C1D95">
      Subdistribution hazard&#160;&#160;
      <tspan font-style="italic">h</tspan>(t)
      <tspan>&#160;&#160;&#8212;&#160;&#160;Fine&#8211;Gray</tspan>
    </text>
    <text x="170" y="468" font-size="11" fill="#6D28D9">selects entire active set: Z&#185; &#8746; Z&#7506; &#8746; Z&#178;</text>

    <circle cx="180" cy="540" r="3" fill="#111827"/>
    <text x="170" y="558" font-size="11" font-style="italic" fill="#374151">O</text>

    <line x1="180" y1="540" x2="290" y2="525" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ah-red)"/>
    <text x="220" y="518" font-size="13" fill="#B91C1C" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">1</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">1</tspan>
    </text>

    <line x1="290" y1="525" x2="410" y2="510" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#ah-purple)"/>
    <text x="335" y="503" font-size="13" fill="#6D28D9" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">S</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">S</tspan>
    </text>

    <line x1="410" y1="510" x2="560" y2="492" stroke="#0F766E" stroke-width="2.5" marker-end="url(#ah-teal)"/>
    <text x="475" y="486" font-size="13" fill="#0F766E" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">2</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">2</tspan>
    </text>

    <line x1="180" y1="540" x2="560" y2="492" stroke="#111827" stroke-width="3.5" marker-end="url(#ah-dark)" stroke-linecap="round"/>
    <text x="580" y="490" font-size="14" fill="#111827" font-weight="600" font-family="'Iowan Old Style', Georgia, serif" font-style="italic">
      &#951; &#8594; log h(t)
    </text>

    <text x="600" y="430" font-size="11" fill="#4C1D95" text-anchor="end">captures direct + indirect effects</text>
  </g>

  <!-- PLANE B: CAUSE-SPECIFIC EVENT 1 -->
  <g id="planeB" transform="translate(0, 200)">
    <polygon points="150,420 760,420 700,580 90,580" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>

    <text x="170" y="450" font-size="14" font-weight="600" fill="#7F1D1D">
      Cause-specific hazard&#160;&#160;
      <tspan font-style="italic">h</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3">(t)</tspan>
      &#160;&#160;&#8212;&#160;&#160;Cox for event 1
    </text>
    <text x="170" y="468" font-size="11" fill="#B91C1C">selects only direct predictors of event 1: Z&#185; &#8746; Z&#7506;</text>

    <circle cx="180" cy="540" r="3" fill="#111827"/>
    <text x="170" y="558" font-size="11" font-style="italic" fill="#374151">O</text>

    <line x1="180" y1="540" x2="290" y2="525" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ah-red)"/>
    <text x="215" y="518" font-size="13" fill="#B91C1C" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">1</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">1</tspan><tspan dy="-3" font-size="11">*</tspan>
    </text>

    <line x1="290" y1="525" x2="410" y2="510" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#ah-purple)"/>
    <text x="328" y="503" font-size="13" fill="#6D28D9" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">S</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">S</tspan><tspan dy="-3" font-size="11">*</tspan>
    </text>

    <line x1="180" y1="540" x2="410" y2="510" stroke="#111827" stroke-width="3.5" marker-end="url(#ah-dark)" stroke-linecap="round"/>
    <text x="430" y="510" font-size="14" fill="#111827" font-weight="600" font-family="'Iowan Old Style', Georgia, serif" font-style="italic">
      &#951;<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> &#8594; log h</tspan><tspan font-size="10" dy="3">1</tspan><tspan dy="-3">(t)</tspan>
    </text>

    <text x="700" y="430" font-size="11" fill="#7F1D1D" text-anchor="end">
      &#946;<tspan font-size="9" dy="3">S</tspan><tspan dy="-3">* &#8800; </tspan>&#946;<tspan font-size="9" dy="3">S</tspan><tspan dy="-3"> in general (different fits, same Z</tspan><tspan font-size="9" dy="-4">S</tspan><tspan dy="4">)</tspan>
    </text>
  </g>

  <!-- PLANE C: Z2 alone -->
  <g id="planeC" transform="translate(0, 400)">
    <polygon points="150,420 760,420 700,580 90,580" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>

    <text x="170" y="450" font-size="14" font-weight="600" fill="#374151">
      Outside event 1's cause-specific span
    </text>
    <text x="170" y="468" font-size="11" fill="#6B7280">Z&#178;-only predictors contribute nothing to h&#8321;(t)</text>

    <circle cx="180" cy="540" r="3" fill="#111827"/>
    <text x="170" y="558" font-size="11" font-style="italic" fill="#374151">O</text>

    <line x1="280" y1="510" x2="430" y2="490" stroke="#0F766E" stroke-width="2.5" marker-end="url(#ah-teal)"/>
    <text x="335" y="483" font-size="13" fill="#0F766E" font-style="italic" font-family="'Iowan Old Style', Georgia, serif">
      Z<tspan font-size="9" dy="-4">2</tspan><tspan dy="4">&#946;</tspan><tspan font-size="9" dy="3">2</tspan>
    </text>

    <circle cx="180" cy="540" r="9" fill="none" stroke="#111827" stroke-width="2.5"/>
    <text x="195" y="563" font-size="13" font-weight="600" fill="#111827" font-family="'Iowan Old Style', Georgia, serif" font-style="italic">
      &#951;<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> = 0</tspan>
    </text>

    <text x="700" y="540" font-size="11" fill="#374151" text-anchor="end" font-style="italic">
      &#8230; yet still alters event 1's
    </text>
    <text x="700" y="555" font-size="11" fill="#374151" text-anchor="end" font-style="italic">
      cumulative incidence via competing risk
    </text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(0, 1140)">
    <text x="60" y="0" font-size="11" font-weight="600" fill="#374151" letter-spacing="1.2">LEGEND</text>
    <line x1="60" y1="20" x2="100" y2="20" stroke="#B91C1C" stroke-width="2.5"/>
    <text x="108" y="24" font-size="11" fill="#374151">solid &#8212; coefficient enters that model</text>
    <line x1="320" y1="20" x2="360" y2="20" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="368" y="24" font-size="11" fill="#374151">dashed &#8212; same predictor, different coefficient (&#946; vs &#946;*)</text>
    <line x1="60" y1="44" x2="100" y2="44" stroke="#111827" stroke-width="3.5"/>
    <text x="108" y="48" font-size="11" fill="#374151">resultant linear predictor &#8594; log hazard</text>
  </g>
</svg>
